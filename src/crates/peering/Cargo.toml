[package]
name = "aurelia-peering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "Aurelia peering transport."

[lib]
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
bitflags.workspace = true
bytes.workspace = true
actix = { workspace = true, optional = true }
futures.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true
rustls-pki-types.workspace = true
x509-parser.workspace = true
ring.workspace = true
asn1-rs.workspace = true
libc.workspace = true
zeroize.workspace = true
aurelia-data = { path = "../data" }
aurelia-logging = { path = "../logging" }
aurelia-ids = { path = "../ids" }
aurelia-platform = { path = "../platform" }
caducus.workspace = true

[features]
actix = ["dep:actix"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }
rcgen.workspace = true
