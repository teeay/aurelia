[package]
name = "aurelia-peering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "Aurelia peering transport."

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
bitflags = "2"
bytes = "1"
actix = { version = "0.13", optional = true }
futures = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
rustls-pki-types = "1"
x509-parser = "0.16"
ring = "0.17"
asn1-rs = "0.6"
libc = "0.2"
zeroize = "1"
aurelia-logging = { path = "../logging" }
aurelia-ids = { path = "../ids" }
caducus = "0.2.1"

[features]
actix = ["dep:actix"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
rcgen = "0.12"
