[package]
name = "aurelia-testing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

description = "Shared test utilities for Aurelia crates."

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["sync"] }
aurelia-peering = { path = "../peering" }
