[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

description = "Aurelia workspace tooling (publish-tree generator and validator)."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
toml_edit = "0.22"
cargo_metadata = "0.18"
fs-err = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
