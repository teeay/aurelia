[package]
name = "aurelia"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Embeddable service mesh for Rust distributed applications."
documentation = "https://docs.rs/aurelia"
readme = "../../README.md"
keywords = ["mesh", "service-mesh", "peering", "mtls", "distributed"]
categories = ["network-programming", "asynchronous"]

[lib]
path = "src/lib.rs"

[dependencies]
aurelia-data = { path = "../crates/data" }
aurelia-ids = { path = "../crates/ids" }
aurelia-platform = { path = "../crates/platform" }
aurelia-peering = { path = "../crates/peering" }
aurelia-resolver = { path = "../crates/resolver" }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "sync"] }

[dev-dependencies]
actix.workspace = true

[features]
actix = ["aurelia-peering/actix"]
