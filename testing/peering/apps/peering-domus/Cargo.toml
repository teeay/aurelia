[package]
name = "peering-domus"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
aurelia = { path = "../../../../src/lib", features = ["actix"] }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
