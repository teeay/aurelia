services:
  domus-1:
    image: "aurelia-${AURELIA_E2E_IMAGE_TAG:-e2e}-domus"
    build:
      context: ../..
      dockerfile: containers/peering/Dockerfile.domus
    environment:
      DOMUS_INDEX: "1"
      PRIMARY_ADDR: "0.0.0.0:5000"
      DRIVER_ADDR: "${AURELIA_E2E_DRIVER_IP:-172.30.0.20}:5000"
      CA_CERT: "/certs/ca/ca.crt"
      DOMUS_CERT: "/certs/domus/domus-1/cert.pem"
      DOMUS_KEY: "/certs/domus/domus-1/key.pem"
      LISTENER_DELAY_MS: "0"
      LISTENER_RECONNECT_TIMEOUT_MS: "1000"
      OOB_CONTROL_PORT: "${AURELIA_E2E_OOB_CONTROL_PORT:-5001}"
      RUST_LOG: "${AURELIA_E2E_DOMUS_LOG:-info}"
    volumes:
      - ../../tmp/certs:/certs:ro
    cap_add:
      - NET_ADMIN
    restart: on-failure
    networks:
      peering-net:
        ipv4_address: ${AURELIA_E2E_DOMUS_1_IP:-172.30.0.11}

  domus-2:
    image: "aurelia-${AURELIA_E2E_IMAGE_TAG:-e2e}-domus"
    build:
      context: ../..
      dockerfile: containers/peering/Dockerfile.domus
    environment:
      DOMUS_INDEX: "2"
      PRIMARY_ADDR: "0.0.0.0:5000"
      DRIVER_ADDR: "${AURELIA_E2E_DRIVER_IP:-172.30.0.20}:5000"
      CA_CERT: "/certs/ca/ca.crt"
      DOMUS_CERT: "/certs/domus/domus-2/cert.pem"
      DOMUS_KEY: "/certs/domus/domus-2/key.pem"
      LISTENER_DELAY_MS: "0"
      LISTENER_RECONNECT_TIMEOUT_MS: "1000"
      OOB_CONTROL_PORT: "${AURELIA_E2E_OOB_CONTROL_PORT:-5001}"
      RUST_LOG: "${AURELIA_E2E_DOMUS_LOG:-info}"
    volumes:
      - ../../tmp/certs:/certs:ro
    cap_add:
      - NET_ADMIN
    restart: on-failure
    networks:
      peering-net:
        ipv4_address: ${AURELIA_E2E_DOMUS_2_IP:-172.30.0.12}

  domus-3:
    image: "aurelia-${AURELIA_E2E_IMAGE_TAG:-e2e}-domus"
    build:
      context: ../..
      dockerfile: containers/peering/Dockerfile.domus
    environment:
      DOMUS_INDEX: "3"
      PRIMARY_ADDR: "0.0.0.0:5000"
      DRIVER_ADDR: "${AURELIA_E2E_DRIVER_IP:-172.30.0.20}:5000"
      CA_CERT: "/certs/ca/ca.crt"
      DOMUS_CERT: "/certs/domus/domus-3/cert.pem"
      DOMUS_KEY: "/certs/domus/domus-3/key.pem"
      LISTENER_DELAY_MS: "0"
      LISTENER_RECONNECT_TIMEOUT_MS: "1000"
      OOB_CONTROL_PORT: "${AURELIA_E2E_OOB_CONTROL_PORT:-5001}"
      RUST_LOG: "${AURELIA_E2E_DOMUS_LOG:-info}"
    volumes:
      - ../../tmp/certs:/certs:ro
    cap_add:
      - NET_ADMIN
    restart: on-failure
    networks:
      peering-net:
        ipv4_address: ${AURELIA_E2E_DOMUS_3_IP:-172.30.0.13}

  driver:
    image: "aurelia-${AURELIA_E2E_IMAGE_TAG:-e2e}-driver"
    build:
      context: ../..
      dockerfile: containers/peering/Dockerfile.driver
    environment:
      PRIMARY_ADDR: "0.0.0.0:5000"
      PRIMARY_PORT: "5000"
      DOMUS_LIST: "domus-1=${AURELIA_E2E_DOMUS_1_IP:-172.30.0.11},domus-2=${AURELIA_E2E_DOMUS_2_IP:-172.30.0.12},domus-3=${AURELIA_E2E_DOMUS_3_IP:-172.30.0.13}"
      OOB_CONTROL_PORT: "${AURELIA_E2E_OOB_CONTROL_PORT:-5001}"
      RUST_LOG: "${AURELIA_E2E_DRIVER_LOG:-info,aurelia_peering=debug}"
      CA_CERT: "/certs/ca/ca.crt"
      DOMUS_CERT: "/certs/domus/driver/cert.pem"
      DOMUS_KEY: "/certs/domus/driver/key.pem"
    volumes:
      - ../../tmp/certs:/certs:ro
    cap_add:
      - NET_ADMIN
    depends_on:
      - domus-1
      - domus-2
      - domus-3
    networks:
      peering-net:
        ipv4_address: ${AURELIA_E2E_DRIVER_IP:-172.30.0.20}

networks:
  peering-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${AURELIA_E2E_SUBNET:-172.30.0.0/24}
